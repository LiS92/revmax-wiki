# Настройки поискового индекса Pagefind (строится по готовому сайту в public/ после сборки Quartz).
site: public
# Индексируется только колонка статьи: заголовок и текст, без меню и подвала.
# Страницы тегов (/tags/…) — автоматические списки, в поиск не попадают.
root_selector: 'body:not([data-slug^="tags/"]) .center'
exclude_selectors:
  - ".page-footer"          # путь к странице (хлебные крошки)
  - ".page-listing"         # автоматический список файлов папки
  - ".model-row"            # карточки мотоциклов на главной
  - "blockquote.callout[data-callout='tiles']"  # плитки разделов на главной
# Коды ошибок и номера с дефисом/точкой ищутся целиком.
include_characters: "-."
